<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HelixPay Fee Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* BRAND TOKENS: swap these to match the brand guidelines */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--brand:#26A4E1;--pink:#F94F8E;--mint:#72FFDF;--navy:#020202;--tint:#E8FFFA;--bg:#F7F7F7;--card:#fff;--ink:#020202;--mut:#5F6368;--line:#E6E6E6;--onbrand:#020202}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#4DB8EE;--navy:#F4F4F4;--tint:#10332C;--bg:#0D0E0F;--card:#17181A;--ink:#F4F4F4;--mut:#9AA0A6;--line:#2B2D30;--onbrand:#0D0E0F}}
:root[data-theme="dark"]{--brand:#4DB8EE;--navy:#F4F4F4;--tint:#10332C;--bg:#0D0E0F;--card:#17181A;--ink:#F4F4F4;--mut:#9AA0A6;--line:#2B2D30;--onbrand:#0D0E0F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line)}
header::before{content:"";display:block;height:4px;background:linear-gradient(90deg,#F94F8E 0 33.3%,#72FFDF 33.3% 66.6%,#26A4E1 66.6%)}
.logochip{background:#fff;border-radius:12px;padding:6px 10px;display:flex}.logochip img{height:52px;width:auto;display:block}
.hd{max-width:980px;margin:0 auto;padding:14px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--navy)}
.logo b{color:var(--brand);font-weight:700}
.tag{color:var(--mut);font-size:13px}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--pink);font-weight:600}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:14px;margin:0 0 14px;display:flex;align-items:center;gap:9px;color:var(--navy)}
h2 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--card);font-size:12px;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.u{position:relative}
input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=number]:focus{outline:2px solid var(--brand);border-color:transparent}
.u span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.u.p span{left:10px;right:auto}.u.p input{padding-left:24px}.u:not(.p) input{padding-right:28px}
.sum{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.sum b{color:var(--ink);font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
tr:last-child td{border-bottom:0}
td input[type=number]{width:80px;padding:6px 8px;text-align:right}
td input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px;flex-wrap:wrap}
.seg button{background:var(--bg);border:0;border-right:1px solid var(--line);padding:8px 14px;font:inherit;color:var(--mut);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--card);font-weight:600}
.desc{color:var(--mut);margin:0 0 10px}
.net{font-weight:700;color:var(--ink)}
tr.best td{background:var(--tint)}
.pill{font-size:10.5px;background:var(--mint);color:#020202;padding:1px 7px;border-radius:99px;margin-left:8px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin:12px 0 0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 16px 8px}
</style>
</head>

const money=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(n);
const mk=a=>a.map(([n,r,m,w])=>({n,r,m,w:!!w}));
const TABS=[
 {name:'Online Transaction',ewt:true,s:{price:1999,pf:5,tf:20,vat:12,wht:0.5,ch:mk([['Local Cards',3,0,0],['GCash',2,0,1],['Intl Cards',4,0,0],['GrabPay',1.7,0,1],['Maya Wallet',1.8,0,1],['Bank Transfer',1,15,1],['QRPH',1.25,0,1]])}},
 {name:'POS Terminal · Walk-ins',ewt:false,s:{price:1000,pf:5,tf:20,vat:12,wht:0,ch:mk([['Cards',2.75,0,0],['QRPH',1.75,0,0]])}},
 {name:'QR Standee · Walk-ins',ewt:false,s:{price:1000,pf:5,tf:20,vat:12,wht:0,ch:mk([['QRPH',1.4,0,0]])}}
];
let cur=0, sel=0;

$('tabs').innerHTML=TABS.map((t,i)=>`<button data-t="${i}">${t.name}</button>`).join('');
$('tabs').onclick=e=>{const t=e.target.dataset.t; if(t===undefined)return; cur=+t; build();};

const f=(k,l,v,u)=>`<div><label>${l}</label><div class="u ${u==='₱'?'p':''}"><input type="number" step="any" min="0" inputmode="decimal" value="${v}" data-f="${k}"><span>${u}</span></div></div>`;

function build(){
 [...$('tabs').children].forEach((b,i)=>b.classList.toggle('on',i===cur));
 const T=TABS[cur], s=T.s;
 $('panel').innerHTML=`
 <section class="card"><h2><i>1</i>Your rates</h2><div class="grid">
  ${f('price','Ticket price',s.price,'₱')}${f('pf','Platform fee',s.pf,'%')}${f('tf','Ticket fee (per ticket)',s.tf,'₱')}${f('vat','VAT',s.vat,'%')}${T.ewt?f('wht','Withholding tax (EWT) rate',s.wht,'%'):''}
 </div><div class="sum" id="sum"></div>${T.ewt?'':'<p class="note">No EWT is withheld on this channel set, so you receive the full amount after fees.</p>'}</section>
 <section class="card"><h2><i>2</i>Payment ${s.ch.length>1?'channels':'channel'}</h2><div class="scroll"><table><thead><tr><th>Channel</th><th>Rate (%)</th><th>Minimum (₱)</th>${T.ewt?'<th>EWT applies</th>':''}<th>Processing fee</th><th>PPF VAT</th></tr></thead><tbody>
 ${s.ch.map((c,i)=>`<tr><td>${c.n}</td><td><input type="number" step="any" min="0" value="${c.r}" data-i="${i}" data-k="r"></td><td><input type="number" step="any" min="0" value="${c.m}" data-i="${i}" data-k="m"></td>${T.ewt?`<td><input type="checkbox" ${c.w?'checked':''} data-i="${i}" data-k="w"></td>`:''}<td id="ppf${i}"></td><td id="pv${i}"></td></tr>`).join('')}
 </tbody></table></div><p class="note">Processing fee is the higher of (ticket price × rate) and the minimum. Use 0 for no minimum.</p></section>
 <section class="card"><h2><i>3</i>Who pays the fees?</h2><div class="seg" id="seg">${[1,2,3,4].map((n,i)=>`<button data-o="${i}" class="${i===sel?'on':''}">Option ${n}</button>`).join('')}</div><p class="desc" id="desc"></p><div class="scroll"><table id="res"></table></div></section>`;
 calc();
}

$('panel').addEventListener('input',e=>{
 const t=e.target, s=TABS[cur].s;
 if(t.dataset.f){s[t.dataset.f]=parseFloat(t.value)||0;}
 else if(t.dataset.i!==undefined){s.ch[t.dataset.i][t.dataset.k]=t.dataset.k==='w'?t.checked:(parseFloat(t.value)||0);}
 else return; calc();
});
$('panel').addEventListener('click',e=>{
 const o=e.target.dataset.o; if(o===undefined)return; sel=+o;
 [...$('seg').children].forEach((b,i)=>b.classList.toggle('on',i===sel)); calc();
});

function calc(){
 const T=TABS[cur], s=T.s, vat=s.vat/100, plat=s.price*s.pf/100, pv=plat*vat;
 $('sum').innerHTML=`<span>Platform fee <b>${money(plat)}</b></span><span>Platform fee VAT <b>${money(pv)}</b></span><span>Ticket fee <b>${money(s.tf)}</b></span>`;
 const rs=s.ch.map(c=>c.r), lo=Math.min(...rs), hi=Math.max(...rs), rng=lo===hi?`${lo}%`:`${lo}–${hi}%`;
 $('desc').textContent=['Pass the ticket fee to attendees. You bear the platform and processing fees.',`Pass processing fees (${rng}) and the ticket fee to attendees. You bear the platform fee.`,'Pass all fees to attendees. You receive the full ticket price.','You absorb all fees, including the ticket fee. Attendees pay the ticket price only.'][sel];
 const rows=s.ch.map((c,i)=>{
  const ppf=Math.max(s.price*c.r/100,c.m), ppv=ppf*vat;
  $('ppf'+i).textContent=money(ppf); $('pv'+i).textContent=money(ppv);
  let pays,bear;
  if(sel===0){pays=s.price+s.tf;bear=plat+pv+ppf+ppv;}
  else if(sel===1){pays=s.price+s.tf+ppf+ppv;bear=plat+pv;}
  else if(sel===2){pays=s.price+s.tf+ppf+ppv+plat+pv;bear=0;}
  else{pays=s.price;bear=plat+pv+ppf+ppv+s.tf;}
  const pre=s.price-bear, tax=T.ewt&&c.w?pre/(1+vat)*s.wht/100:0;
  return {n:c.n,pays,bear,tax,net:pre-tax};
 });
 const best=Math.max(...rows.map(r=>r.net)), multi=rows.length>1;
 $('res').innerHTML=`<thead><tr><th>Channel</th><th>Attendee pays</th><th>Fees you bear</th>${T.ewt?'<th>Withholding tax</th>':''}<th>You receive</th></tr></thead><tbody>`+
 rows.map(r=>`<tr class="${multi&&r.net===best?'best':''}"><td>${r.n}${multi&&r.net===best?'<span class="pill">Best</span>':''}</td><td>${money(r.pays)}</td><td>${money(r.bear)}</td>${T.ewt?`<td>${money(r.tax)}</td>`:''}<td class="net">${money(r.net)}</td></tr>`).join('')+'</tbody>';
}
build();
</script>
</body>
</html>
